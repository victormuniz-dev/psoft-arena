spring.application.name=arena

# Chave mestra AES-256 (32 bytes) codificada em Base64, fornecida via ambiente.
app.criptografia.chave-mestra-base64=${ARENA_CRIPTOGRAFIA_CHAVE_MESTRA:}

# Configuração do H2 e Console Web
spring.datasource.url=jdbc:h2:mem:arenadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
